name: Lyric Video Studio APK

on:
  push:
    paths:
      - "LyricVideoAndroid/**"
      - ".github/workflows/lyric-video-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LyricVideoAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run lyric timing tests
        run: ./run-tests.sh

      - name: Restore the signing key (optional LYRICS_KEYSTORE_BASE64 secret)
        env:
          LYRICS_KEYSTORE_BASE64: ${{ secrets.LYRICS_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          if [ -n "$LYRICS_KEYSTORE_BASE64" ]; then
            echo "$LYRICS_KEYSTORE_BASE64" | base64 -d > build/release.keystore
          else
            echo "::warning::No LYRICS_KEYSTORE_BASE64 secret: a new signing key is generated, so this APK cannot update an install signed with a different key."
          fi

      - name: Build and sign the APK
        run: |
          ./build.sh
          echo "Signing certificate (the same fingerprint every build means updates install over the old app):"
          keytool -printcert -jarfile LyricVideoStudio.apk | grep -i "SHA256:" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyricVideoStudio-apk
          path: LyricVideoAndroid/LyricVideoStudio.apk
          retention-days: 30
