name: Monkey test (random taps on an emulator)

# Installs the app on an Android 13 emulator and lets Android's "monkey" tap, drag and type at random
# for a few thousand events, then prints every crash and freeze it found.
# Runs when a pushed commit message contains [monkey], or by hand from the Actions tab.
on:
  push:
    branches: [ai-generator]
  workflow_dispatch:

jobs:
  monkey:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[monkey]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264"
      - name: Install zip
        run: sudo apt-get update -q && sudo apt-get install -y -q zip
      - name: Build the APK
        working-directory: CityStudioAndroid
        run: bash build.sh
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the monkey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash CityStudioAndroid/tools/monkey.sh CityStudioAndroid/AudioCityStudio.apk monkey-report
      - name: Show the report
        if: always()
        run: cat monkey-report/summary.txt || true
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-report
          path: monkey-report
