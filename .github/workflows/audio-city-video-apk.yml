      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile the native app
        working-directory: AudioCityVideoAndroid
        run: bash gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify the APK signature
        run: |
          cp AudioCityVideoAndroid/app/build/outputs/apk/debug/app-debug.apk Audio-City-Video-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Audio-City-Video-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-City-Video-Android
          path: Audio-City-Video-Android.apk
          if-no-files-found: error
