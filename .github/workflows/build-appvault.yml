name: Build AppVault APK

on:
  push:
    paths: ["AppVault/**", ".github/workflows/build-appvault.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AppVault
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run tests
        run: ./run-tests.sh

      - name: Restore the signing key (from the APPVAULT_KEYSTORE_BASE64 secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.APPVAULT_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > build/development.keystore
          else
            echo "::warning::No APPVAULT_KEYSTORE_BASE64 secret: a new key is generated, so this APK cannot update an install signed with a different key."
          fi

      - name: Build and sign the APK
        run: ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-apk
          path: AppVault/AppVault.apk
          retention-days: 30
