name: City Cinema APK

on:
  push:
    paths:
      - "CityCinemaAndroid/**"
      - ".github/workflows/city-cinema.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CityCinemaAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Host tests
        run: ./run-tests.sh

      - name: Verify CinemaDNG output with LibRaw
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q rawpy numpy
          mkdir -p /tmp/dng
          java -cp "build/test/tests:build/test/classes:$ANDROID_SDK_ROOT/platforms/android-35/android.jar" ug.audiocity.cinema.CinemaTests /tmp/dng
          /tmp/venv/bin/python -I tools/verify_dng.py /tmp/dng

      - name: Verify the ProRes encoder (.mov, FFmpeg decode, NEON bit-exactness on emulated ARM64)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.3.11579264" ./tools/prores-check.sh "$(command -v ffmpeg)" /tmp/venv/bin/python 1920 1080 12
          ./tools/prores-check.sh "$(command -v ffmpeg)" /tmp/venv/bin/python 3840 2160 3 | tail -n 8

      - name: Restore the signing key (from the CINEMA_KEYSTORE_BASE64 secret)
        env:
          CINEMA_KEYSTORE_BASE64: ${{ secrets.CINEMA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          if [ -n "$CINEMA_KEYSTORE_BASE64" ]; then
            echo "$CINEMA_KEYSTORE_BASE64" | base64 -d > build/development.keystore
          else
            echo "::warning::No CINEMA_KEYSTORE_BASE64 secret: a new key is generated, so this APK cannot update an install signed with a different key."
          fi

      - name: Build and sign the APK (with the native ProRes encoder)
        run: ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.3.11579264" ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CityCinema-apk
          path: CityCinemaAndroid/CityCinema.apk
          retention-days: 30
