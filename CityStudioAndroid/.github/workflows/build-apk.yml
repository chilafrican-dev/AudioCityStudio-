name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform, build tools and NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install ffmpeg (used by the export tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg zip

      - name: Run host test suites
        run: ./run-tests.sh

      - name: Verify sampled piano instruments and performance engine
        run: ./run-core-tests.sh

      - name: Restore the signing key (from the KEYSTORE_BASE64 secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p build
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > build/development.keystore
          else
            echo "::warning::No KEYSTORE_BASE64 secret: a new key is generated, so this APK cannot update an install signed with a different key."
          fi

      - name: Build and sign the APK (with native AAudio)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioCityStudio-apk
          path: AudioCityStudio.apk
          retention-days: 30
